name: kavanest-api

namespace: kavanest
env:
  APP_VERSION: fabd01d0c6abc702f73ec91f3c3f808402b517e3

deployment:
  - name: kavanest-api
    image: invisibug/kavanest-api
    ports:
    - port: 4000
    env:
    - name: MONGO
      value: mongodb://kavanest-mongo:27017

    - name: MQTT
      value: mqtt://mqtt.kavanet.io

    # - name: NODE_ENV
    #   value: production

httpRoute:
  name: api.kavanet.io
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: api.kavanet.io
  path: /
  serviceName: kavanest-api
  servicePort: 80

service:
  name: kavanest-api
  selector: kavanest-api
  port: 80
  targetPort: 3100

